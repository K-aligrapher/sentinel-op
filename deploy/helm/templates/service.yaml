apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-agent
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app.kubernetes.io/name: sentinel
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: alert-webhook
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
