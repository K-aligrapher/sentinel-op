# Registered in TrueForge via Settings -> Connectors -> Add from config.
connectors:
  - name: kubernetes
    url: http://localhost:8000
    transport: streamable-http
    description: "Kubernetes cluster operations — kubectl, pod logs, describe"

  - name: prometheus
    url: http://localhost:8001
    transport: streamable-http
    env:
      PROMETHEUS_URL: http://localhost:9090
    description: "Prometheus metrics — PromQL queries, alert status"

  - name: github
    url: http://localhost:8002
    transport: streamable-http
    description: "GitHub — create PRs, read repos, post comments"
